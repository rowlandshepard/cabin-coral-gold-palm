<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>HA Unit 1 Quiz</title>
  <!-- static GitHub Pages build 2026-08-30 -->
  <style>
:root {
  --bg: #0f1419;
  --card: #1a222c;
  --ink: #e8eef4;
  --muted: #9aa8b5;
  --accent: #3db8a0;
  --accent-dim: #1f4f46;
  --wrong: #d36b6b;
  --right: #4caf86;
  --line: #2a3542;
  --warn: #d4a24c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(1200px 600px at 10% -10%, #1c3a36 0%, transparent 50%), var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
.app { max-width: 820px; margin: 0 auto; padding: 28px 18px 60px; }
.topbar { margin-bottom: 22px; }
.eyebrow { letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-size: 12px; margin: 0 0 4px; }
h1 { margin: 0; font-size: 28px; }
.tagline { color: var(--muted); margin: 6px 0 0; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
}
.hidden { display: none !important; }
.muted { color: var(--muted); }
.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.pick {
  background: #12181f;
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 12px;
  padding: 12px 14px;
  text-align: left;
  cursor: pointer;
}
.pick.active { border-color: var(--accent); background: var(--accent-dim); }
.pick small { display: block; color: var(--muted); margin-top: 4px; }
.check { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); margin: 8px 0 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); padding: 10px 16px; }
.primary { background: var(--accent); color: #06221c; border-color: transparent; font-weight: 700; }
.ghost { background: transparent; color: var(--ink); }
.meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.pill { background: var(--accent-dim); color: var(--accent); padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.type { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--warn); margin: 0 0 8px; }
#q-prompt { font-size: 22px; line-height: 1.35; margin: 0 0 16px; }
.choice {
  display: block; width: 100%; text-align: left;
  background: #12181f; color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; margin: 0 0 8px;
}
.choice.selected { border-color: var(--accent); }
.choice.right { border-color: var(--right); background: #163329; }
.choice.wrong { border-color: var(--wrong); background: #3a1d1d; }
#short-input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: #12181f; color: var(--ink); font: inherit;
}
.feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); }
.feedback.ok { border-color: var(--right); }
.feedback.bad { border-color: var(--wrong); }
.stats { color: var(--muted); font-size: 14px; }
@media (max-width: 640px) {
  .picker { grid-template-columns: 1fr; }
  h1 { font-size: 22px; }
  #q-prompt { font-size: 18px; }
}

  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Human Anatomy · Unit 1</p>
        <h1>Core Study Quiz</h1>
      </div>
      <p class="tagline">One question at a time · answers tagged by lecture</p>
    </header>

    <section id="start-screen" class="card start">
      <h2>Lecture picker</h2>
      <p class="muted">Questions are pulled from the Unit 1 study guide and answered from the lecture decks. Correct items can be skipped on later runs.</p>
      <div class="picker" id="lecture-picker"></div>
      <label class="check">
        <input type="checkbox" id="skip-correct" checked />
        Subsequent quizzes exclude questions you already answered correctly
      </label>
      <div class="stats" id="start-stats"></div>
      <div class="row">
        <button id="start-btn" class="primary">Start quiz</button>
        <button id="reset-btn" class="ghost">Reset saved progress</button>
      </div>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="meta">
        <span id="q-tag" class="pill"></span>
        <span id="q-progress" class="muted"></span>
      </div>
      <p id="q-type" class="type"></p>
      <h2 id="q-prompt"></h2>
      <div id="q-choices"></div>
      <div id="q-short" class="hidden">
        <input id="short-input" type="text" autocomplete="off" placeholder="Type your answer" />
      </div>
      <div class="row">
        <button id="submit-btn" class="primary">Check answer</button>
        <button id="next-btn" class="ghost hidden">Next question</button>
        <button id="quit-btn" class="ghost">End quiz</button>
      </div>
      <div id="feedback" class="feedback hidden"></div>
    </section>

    <section id="end-screen" class="card hidden">
      <h2>Session complete</h2>
      <p id="end-summary"></p>
      <div class="row">
        <button id="again-btn" class="primary">Back to lecture picker</button>
      </div>
    </section>
  </div>
  <script>
const QUESTIONS = [
  // ===== L1 Foundations =====
  { id:"L1-01", lecture:"L1", tag:"L1 1 A", type:"mc",
    prompt:"Anatomy is best defined as:",
    choices:["The study of internal and external structures","The study of how structures function","The study of disease only","The study of chemistry of life"],
    answer:0, accept:["study of internal and external structures","study of structures"],
    explain:"Lecture 1: Anatomy = study of internal and external structures. Structure determines function." },
  { id:"L1-02", lecture:"L1", tag:"L1 2 A", type:"mc",
    prompt:"Physiology is best defined as:",
    choices:["Naming body regions","The study of how anatomical structures function","Imaging only","Measuring body mass"],
    answer:1, accept:["how anatomical structures function","function of structures"],
    explain:"Physiology is the study of how anatomical structures function." },
  { id:"L1-03", lecture:"L1", tag:"L1 3 A", type:"short",
    prompt:"Define congenital.",
    accept:["present from birth","present at birth","disease or condition present from birth"],
    explain:"Situs inversus example: congenital = a disease or condition present from birth." },
  { id:"L1-04", lecture:"L1", tag:"L1 4 A", type:"short",
    prompt:"Define homeostasis.",
    accept:["maintaining a stable internal environment","stable internal environment","keeping internal conditions stable"],
    explain:"Homeostasis is maintaining a relatively stable internal environment despite external change." },
  { id:"L1-05", lecture:"L1", tag:"L1 5 A", type:"mc",
    prompt:"A person lying face up is in the _____ position.",
    choices:["Prone","Supine","Lateral","Fowler"],
    answer:1, accept:["supine"],
    explain:"Supine = face up. Prone = face down." },
  { id:"L1-06", lecture:"L1", tag:"L1 6 A", type:"mc",
    prompt:"A person lying face down is in the _____ position.",
    choices:["Supine","Prone","Anatomical","Oblique"],
    answer:1, accept:["prone"],
    explain:"Prone = face down." },
  { id:"L1-07", lecture:"L1", tag:"L1 7 A", type:"mc",
    prompt:"Which directional term means toward the head / above?",
    choices:["Inferior","Superior","Distal","Deep"],
    answer:1, accept:["superior"],
    explain:"Superior = above / toward the head. Inferior = below / toward the feet." },
  { id:"L1-08", lecture:"L1", tag:"L1 8 A", type:"mc",
    prompt:"Anterior is closest in meaning to:",
    choices:["Back / dorsal","Front / ventral","Farther from trunk","Toward midline"],
    answer:1, accept:["front","ventral"],
    explain:"Anterior = front. Posterior = back." },
  { id:"L1-09", lecture:"L1", tag:"L1 9 A", type:"mc",
    prompt:"The elbow is _____ to the wrist.",
    choices:["Distal","Proximal","Lateral","Superficial"],
    answer:1, accept:["proximal"],
    explain:"Proximal = closer to the trunk attachment. Distal = farther from the trunk." },
  { id:"L1-10", lecture:"L1", tag:"L1 10 C", type:"mc",
    prompt:"Which plane is evaluated during a CT scan?",
    choices:["Frontal (coronal)","Sagittal","Transverse (horizontal)","Oblique only"],
    answer:2, accept:["transverse","horizontal"],
    explain:"CT slices the body in transverse (axial/horizontal) planes." },
  { id:"L1-11", lecture:"L1", tag:"L1 11 A", type:"mc",
    prompt:"A frontal (coronal) plane divides the body into:",
    choices:["Right and left","Superior and inferior","Anterior and posterior","Proximal and distal"],
    answer:2, accept:["anterior and posterior","front and back"],
    explain:"Frontal/coronal = front vs back. Sagittal = right vs left. Transverse = top vs bottom." },
  { id:"L1-12", lecture:"L1", tag:"L1 12 A", type:"short",
    prompt:"What is the smallest living unit of the body?",
    accept:["cell","the cell","cells"],
    explain:"Cells are the smallest living unit. Atoms/molecules/electrolytes are not living." },
  { id:"L1-13", lecture:"L1", tag:"L1 13 A", type:"short",
    prompt:"How do we obtain electrolytes?",
    accept:["from food","from the food we eat","diet","food"],
    explain:"Electrolytes (charged atoms such as Na+, K+) and organic molecules come from food." },
  { id:"L1-14", lecture:"L1", tag:"L1 14 A", type:"mc",
    prompt:"Levels of organization from smallest to largest:",
    choices:["Organ → tissue → cell → molecule","Atom/molecule → cell → tissue → organ → organ system → organism","Tissue → cell → organ → organism","Organ system → organ → tissue → cell"],
    answer:1, accept:["chemical cell tissue organ organ system organism"],
    explain:"Chemical (atom/molecule) → cellular → tissue → organ → organ system → organism." },
  { id:"L1-15", lecture:"L1", tag:"L1 15 A", type:"mc",
    prompt:"The axial body includes the:",
    choices:["Arms and legs","Trunk (head, neck, thorax, abdomen, pelvis)","Hands only","Appendages only"],
    answer:1, accept:["trunk","head neck trunk"],
    explain:"Axial = trunk. Appendicular = arms and legs." },
  { id:"L1-16", lecture:"L1", tag:"L1 16 A", type:"tf",
    prompt:"The appendicular body involves the arms and legs.",
    choices:["True","False"],
    answer:0, accept:["true"],
    explain:"Appendicular body = arms and legs. Axial = trunk." },
  { id:"L1-17", lecture:"L1", tag:"L1 17 A", type:"mc",
    prompt:"The somatic body involves:",
    choices:["Internal organs in cavities","Superficial structures such as skin and skeletal muscle","Only the brain","Only blood"],
    answer:1, accept:["skin and skeletal muscle","superficial structures"],
    explain:"Somatic = superficial structures (skin, skeletal muscle). Visceral = internal organs." },
  { id:"L1-18", lecture:"L1", tag:"L1 18 A", type:"mc",
    prompt:"Which abdominal quadrant contains the appendix?",
    choices:["RUQ","LUQ","RLQ","LLQ"],
    answer:2, accept:["rlq","right lower quadrant"],
    explain:"Lecture 1 quadrants: RUQ gallbladder, LUQ stomach, LLQ colon, RLQ appendix." },
  { id:"L1-19", lecture:"L1", tag:"L1 19 A", type:"mc",
    prompt:"Which organ is listed in the left upper quadrant (LUQ) on the lecture slide?",
    choices:["Appendix","Gallbladder","Stomach","Urinary bladder"],
    answer:2, accept:["stomach"],
    explain:"LUQ = stomach. RUQ = gallbladder." },
  { id:"L1-20", lecture:"L1", tag:"L1 20 A", type:"mc",
    prompt:"The fast-acting control system of the body is the:",
    choices:["Endocrine system","Nervous system","Urinary system","Integumentary system"],
    answer:1, accept:["nervous"],
    explain:"Nervous = fast-acting control. Endocrine = slow-acting control via hormones." },
  { id:"L1-21", lecture:"L1", tag:"L1 21 A", type:"mc",
    prompt:"Which system supplies O2 and removes CO2?",
    choices:["Digestive","Urinary","Respiratory","Lymphatic"],
    answer:2, accept:["respiratory"],
    explain:"Respiratory supplies oxygen and removes carbon dioxide." },
  { id:"L1-22", lecture:"L1", tag:"L1 22 A", type:"mc",
    prompt:"Antecubital refers to the:",
    choices:["Wrist","Front of the elbow","Armpit","Chin"],
    answer:1, accept:["front of elbow","front of the elbow"],
    explain:"Antecubital = front of elbow. Axillary = armpit. Mental = chin. Carpal = wrist." },
  { id:"L1-23", lecture:"L1", tag:"L1 23 A", type:"mc",
    prompt:"Buccal refers to the:",
    choices:["Cheek","Nose","Forehead","Navel"],
    answer:0, accept:["cheek"],
    explain:"Buccal = cheek. Frontal = forehead. Nasal = nose. Umbilical = navel." },

  // ===== L2 Body Chemistry =====
  { id:"L2-01", lecture:"L2", tag:"L2 1 A", type:"mc",
    prompt:"A hydrophilic substance:",
    choices:["Repels water","Has an affinity for water","Is always a lipid","Cannot dissolve ions"],
    answer:1, accept:["affinity for water","loves water","water loving"],
    explain:"Hydrophilic = affinity for water. Hydrophobic = does not mix with water." },
  { id:"L2-02", lecture:"L2", tag:"L2 2 A", type:"mc",
    prompt:"Oil molecules are hydrophobic because they:",
    choices:["Have charged bonds","Have uncharged bonds","Are ions","Are sugars"],
    answer:1, accept:["uncharged bonds"],
    explain:"Hydrophobic substances lack charge and do not attract water." },
  { id:"L2-03", lecture:"L2", tag:"L2 3 A", type:"short",
    prompt:"Why is water so good at dissolving things?",
    accept:["it is polar","charge","its charge","versatile solvent due to its charge","polar solvent"],
    explain:"Water is a versatile solvent because of its charge; it attracts other charged molecules." },
  { id:"L2-04", lecture:"L2", tag:"L2 4 A", type:"mc",
    prompt:"The dissolving agent of a solution is the:",
    choices:["Solute","Solvent","Enzyme","Buffer"],
    answer:1, accept:["solvent"],
    explain:"Solvent dissolves; solute is what is dissolved. In the body the main solvent is water." },
  { id:"L2-05", lecture:"L2", tag:"L2 5 A", type:"mc",
    prompt:"Which organic group is involved with energy, metabolism, and structural support?",
    choices:["Lipids","Carbohydrates","Nucleic acids","Steroids only"],
    answer:1, accept:["carbohydrates"],
    explain:"Carbohydrates: energy, metabolism, and structural support." },
  { id:"L2-06", lecture:"L2", tag:"L2 6 A", type:"mc",
    prompt:"Which group is united by hydrophobia?",
    choices:["Carbohydrates","Proteins","Lipids","Nucleic acids"],
    answer:2, accept:["lipids","fats"],
    explain:"Lipids are hydrophobic (or amphipathic for phospholipids)." },
  { id:"L2-07", lecture:"L2", tag:"L2 7 A", type:"mc",
    prompt:"Which group is responsible for almost all cellular function (a cell’s “job”)?",
    choices:["Lipids","Carbohydrates","Proteins","Steroids"],
    answer:2, accept:["proteins"],
    explain:"Proteins are responsible for almost everything about a life form; a cell’s job is to make proteins." },
  { id:"L2-08", lecture:"L2", tag:"L2 8 A", type:"mc",
    prompt:"Which group provides instructions on how to make proteins?",
    choices:["Lipids","Carbohydrates","Nucleic acids","Triglycerides"],
    answer:2, accept:["nucleic acids","dna"],
    explain:"Nucleic acids (DNA/RNA) store and transmit instructions for proteins." },
  { id:"L2-09", lecture:"L2", tag:"L2 9 A", type:"mc",
    prompt:"Which carbohydrate is associated with ATP production (immediate fuel)?",
    choices:["Cellulose","Glycogen","Glucose","Starch"],
    answer:2, accept:["glucose"],
    explain:"Glucose units fuel ATP production. Glycogen stores energy in animals; starch in plants; cellulose is plant cell walls." },
  { id:"L2-10", lecture:"L2", tag:"L2 10 A", type:"mc",
    prompt:"Glycogen is:",
    choices:["Plant cell wall structure","Energy storage in animals (liver and skeletal muscle)","Dietary fiber only","A steroid hormone"],
    answer:1, accept:["energy storage in animals","storage in liver and skeletal muscle"],
    explain:"Glycogen = animal energy storage in liver and skeletal muscle. Limited stores in newborns → hypoglycemia risk." },
  { id:"L2-11", lecture:"L2", tag:"L2 11 A", type:"mc",
    prompt:"Plant energy storage carbohydrate is:",
    choices:["Glycogen","Starch","Cellulose","Glucose only"],
    answer:1, accept:["starch"],
    explain:"Starch stores energy in plants. Cellulose is structural in plant cell walls." },
  { id:"L2-12", lecture:"L2", tag:"L2 12 A", type:"mc",
    prompt:"Which lipid type is found in the diet and used for energy?",
    choices:["Phospholipids","Triglycerides","Steroids","Cellulose"],
    answer:1, accept:["triglycerides","fats"],
    explain:"3 lipid types: triglycerides (diet/energy), phospholipids (membranes), steroids (membranes + hormones)." },
  { id:"L2-13", lecture:"L2", tag:"L2 13 A", type:"mc",
    prompt:"Which lipid has a hydrophilic portion and a hydrophobic portion?",
    choices:["Triglyceride","Phospholipid","Cellulose","Glycogen"],
    answer:1, accept:["phospholipid"],
    explain:"Phospholipids: hydrophilic head + hydrophobic tails → bilayer of the plasma membrane." },
  { id:"L2-14", lecture:"L2", tag:"L2 14 A", type:"mc",
    prompt:"Which lipid has a 4-ring structure?",
    choices:["Triglyceride","Phospholipid","Steroid","Starch"],
    answer:2, accept:["steroid","steroids"],
    explain:"Steroids are unified by four fused rings (cholesterol, estrogen, testosterone, cortisol)." },
  { id:"L2-15", lecture:"L2", tag:"L2 15 A", type:"mc",
    prompt:"Osmosis is the diffusion of _____ across a membrane.",
    choices:["Glucose","Sodium","Water","Protein"],
    answer:2, accept:["water"],
    explain:"Osmosis = diffusion of water across a membrane." },
  { id:"L2-16", lecture:"L2", tag:"L2 16 A", type:"mc",
    prompt:"Solutes (and water by osmosis) move from:",
    choices:["Low to high concentration without energy always","High to low concentration (down the gradient)","Only into the nucleus","Randomly with no pattern"],
    answer:1, accept:["high to low"],
    explain:"Molecules diffuse from high to low concentration. Water follows solute: toward higher solute." },
  { id:"L2-17", lecture:"L2", tag:"L2 17 A", type:"mc",
    prompt:"A cell placed in a hypertonic (very concentrated) environment will:",
    choices:["Swell and possibly lyse","Lose water and shrink","Stay exactly the same forever","Make more glycogen"],
    answer:1, accept:["shrink","crenate","lose water"],
    explain:"Hypertonic = higher solute outside → water leaves the cell. Hypotonic = water enters → swell." },
  { id:"L2-18", lecture:"L2", tag:"L2 18 A", type:"application",
    prompt:"Why can’t humans drink salt water?",
    choices:["It is hypotonic and explodes cells","It is hypertonic, pulling water out of cells and dehydrating the body","Salt cannot dissolve in water","It blocks transcription"],
    answer:1, accept:["hypertonic","dehydrates","pulls water out"],
    explain:"Seawater is hypertonic to body fluids; water leaves cells and you become more dehydrated." },
  { id:"L2-19", lecture:"L2", tag:"L2 19 A", type:"application",
    prompt:"Water intoxication puts cells in a _____ environment so they swell.",
    choices:["Hypertonic","Isotonic","Hypotonic","Hydrophobic"],
    answer:2, accept:["hypotonic"],
    explain:"Too much free water lowers extracellular solute → hypotonic → water rushes into cells." },
  { id:"L2-20", lecture:"L2", tag:"L2 20 A", type:"mc",
    prompt:"The majority of the plasma membrane is made of:",
    choices:["DNA","Phospholipids","Glycogen","Cellulose"],
    answer:1, accept:["phospholipids","phospholipid bilayer"],
    explain:"Plasma membrane = phospholipid bilayer. Two major jobs: barrier and selective transport." },
  { id:"L2-21", lecture:"L2", tag:"L2 21 A", type:"mc",
    prompt:"Which molecules cross the plasma membrane easily without help?",
    choices:["Sugars","Ions","Hydrophobic molecules","Proteins"],
    answer:2, accept:["hydrophobic","lipids","nonpolar"],
    explain:"Hydrophobic molecules dissolve in the lipid bilayer. Hydrophilic molecules and ions need proteins." },
  { id:"L2-22", lecture:"L2", tag:"L2 22 A", type:"mc",
    prompt:"Active transport moves solutes _____ and requires _____.",
    choices:["Down their gradient; no energy","Against their gradient; energy (ATP)","Only water; osmosis","Randomly; heat only"],
    answer:1, accept:["against gradient atp","low to high atp"],
    explain:"Active transport = low → high concentration and requires energy." },
  { id:"L2-23", lecture:"L2", tag:"L2 23 A", type:"mc",
    prompt:"“Cellular eating” of solid particles is:",
    choices:["Pinocytosis","Phagocytosis","Receptor-mediated endocytosis only","Osmosis"],
    answer:1, accept:["phagocytosis"],
    explain:"Phagocytosis = cellular eating. Pinocytosis = cellular drinking. Receptor-mediated = specific cargo." },
  { id:"L2-24", lecture:"L2", tag:"L2 24 A", type:"mc",
    prompt:"The most specific form of endocytosis is:",
    choices:["Phagocytosis","Pinocytosis","Receptor-mediated endocytosis","Simple diffusion"],
    answer:2, accept:["receptor-mediated endocytosis","receptor mediated"],
    explain:"Receptor-mediated endocytosis selects molecules that bind membrane receptors (e.g., cholesterol)." },
  { id:"L2-25", lecture:"L2", tag:"L2 25 A", type:"tf",
    prompt:"Electrolytes help control osmosis.",
    choices:["True","False"],
    answer:0, accept:["true"],
    explain:"Electrolytes are charged atoms inside/outside cells; they create osmotic gradients and electrical signals." },

  // ===== L3 Cell =====
  { id:"L3-01", lecture:"L3", tag:"L3 1 A", type:"mc",
    prompt:"Which junction completely fuses cells and prevents substances from passing between them?",
    choices:["Desmosome","Gap junction","Tight junction","Hemidesmosome only"],
    answer:2, accept:["tight junction","tight junctions"],
    explain:"Tight junctions seal cells (best barrier). Desmosomes = strongest spot welds. Gap junctions = passageways/communication." },
  { id:"L3-02", lecture:"L3", tag:"L3 2 A", type:"mc",
    prompt:"Which junction provides a passageway so cells can communicate?",
    choices:["Tight junction","Desmosome","Gap junction","Plasmodesmata in humans"],
    answer:2, accept:["gap junction","gap junctions"],
    explain:"Gap junctions create channels between cells." },
  { id:"L3-03", lecture:"L3", tag:"L3 3 A", type:"mc",
    prompt:"Which junction creates the strongest connection but does not completely fuse cells?",
    choices:["Tight junction","Desmosome","Gap junction","Nucleus"],
    answer:1, accept:["desmosome","desmosomes"],
    explain:"Desmosomes are anchoring junctions (strongest mechanical connection)." },
  { id:"L3-04", lecture:"L3", tag:"L3 4 A", type:"mc",
    prompt:"An increased number of cells in an area is:",
    choices:["Hypertrophy","Hyperplasia","Atrophy","Necrosis"],
    answer:1, accept:["hyperplasia"],
    explain:"Hyperplasia = more cells. Hypertrophy = bigger cells. Atrophy = smaller size or fewer cells." },
  { id:"L3-05", lecture:"L3", tag:"L3 5 A", type:"mc",
    prompt:"Increased cell size in an area is:",
    choices:["Hyperplasia","Hypertrophy","Apoptosis","Metaphase"],
    answer:1, accept:["hypertrophy"],
    explain:"Hypertrophy = increase in cell size (classic skeletal muscle training)." },
  { id:"L3-06", lecture:"L3", tag:"L3 6 A", type:"mc",
    prompt:"Programmed cell death that does NOT spill contents is:",
    choices:["Necrosis","Apoptosis","Hyperplasia","Pinocytosis"],
    answer:1, accept:["apoptosis"],
    explain:"Apoptosis = programmed; lysosomes destroy contents inside. Necrosis = after severe damage; contents spill and trigger inflammation." },
  { id:"L3-07", lecture:"L3", tag:"L3 7 A", type:"mc",
    prompt:"Which death process triggers the immune/inflammatory response?",
    choices:["Apoptosis","Necrosis","Mitosis","Transcription"],
    answer:1, accept:["necrosis"],
    explain:"Spilled cellular contents in necrosis alarm the immune system." },
  { id:"L3-08", lecture:"L3", tag:"L3 8 A", type:"mc",
    prompt:"Intracellular fluid is the:",
    choices:["Plasma","Cytosol / cytoplasm","Interstitial fluid only","Matrix"],
    answer:1, accept:["cytosol","cytoplasm","intracellular fluid"],
    explain:"Three basic cell parts: plasma membrane, cytoplasm/cytosol (ICF), nucleus." },
  { id:"L3-09", lecture:"L3", tag:"L3 9 A", type:"mc",
    prompt:"Folded mitochondrial membranes are advantageous because they:",
    choices:["Store DNA only","Increase surface area and make ATP production more efficient","Make glycogen","Form cilia"],
    answer:1, accept:["increase surface area","more efficient"],
    explain:"Folding membranes make mitochondria more efficient at ATP production." },
  { id:"L3-10", lecture:"L3", tag:"L3 10 A", type:"mc",
    prompt:"Cytoplasmic ribosomes make proteins for _____; RER ribosomes make proteins for _____.",
    choices:["Export; the cell itself","The cell itself; outside the cell / membranes / lysosomes","Nucleus; mitochondria","ATP; DNA"],

const STORAGE_KEY = "ha_unit1_correct_ids_v1";

const LECTURES = [
  { id: "ALL", title: "All lectures", sub: "Full Unit 1 bank" },
  { id: "L1", title: "L1 Foundations", sub: "Terms, planes, systems" },
  { id: "L2", title: "L2 Body chemistry", sub: "Water, macromolecules, membrane" },
  { id: "L3", title: "L3 The cell", sub: "Junctions, organelles, mitosis" },
  { id: "L4", title: "L4 Tissues part 1", sub: "Embryo + epithelium" },
  { id: "L5", title: "L5 Tissues part 2", sub: "Membranes, CT, muscle, nerve" }
];

const state = {
  lecture: "ALL",
  queue: [],
  index: 0,
  selected: null,
  locked: false,
  correctThisRun: 0,
  answeredThisRun: 0
};

function loadCorrect() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}
function saveCorrect(ids) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...new Set(ids)]));
}

function norm(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/[^a-z0-9+\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function matchesAccept(user, accept) {
  const u = norm(user);
  if (!u) return false;
  return (accept || []).some(a => {
    const n = norm(a);
    return u === n || u.includes(n) || n.includes(u);
  });
}

function poolFor(lecture, skipCorrect) {
  const correct = new Set(loadCorrect());
  return QUESTIONS.filter(q => {
    if (lecture !== "ALL" && q.lecture !== lecture) return false;
    if (skipCorrect && correct.has(q.id)) return false;
    return true;
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderPicker() {
  const box = document.getElementById("lecture-picker");
  box.innerHTML = "";
  const correct = new Set(loadCorrect());
  LECTURES.forEach(L => {
    const total = QUESTIONS.filter(q => L.id === "ALL" || q.lecture === L.id).length;
    const done = QUESTIONS.filter(q => (L.id === "ALL" || q.lecture === L.id) && correct.has(q.id)).length;
    const btn = document.createElement("button");
    btn.className = "pick" + (state.lecture === L.id ? " active" : "");
    btn.innerHTML = `<strong>${L.title}</strong><small>${L.sub} · ${done}/${total} mastered</small>`;
    btn.onclick = () => { state.lecture = L.id; renderPicker(); };
    box.appendChild(btn);
  });
  const all = QUESTIONS.length;
  document.getElementById("start-stats").textContent =
    `${correct.size} of ${all} questions marked correct on this device.`;
}

function show(id) {
  ["start-screen", "quiz-screen", "end-screen"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
}

function startQuiz() {
  const skip = document.getElementById("skip-correct").checked;
  let pool = poolFor(state.lecture, skip);
  if (!pool.length) pool = poolFor(state.lecture, false);
  state.queue = shuffle(pool);
  state.index = 0;
  state.correctThisRun = 0;
  state.answeredThisRun = 0;
  if (!state.queue.length) {
    alert("No questions in this lecture.");
    return;
  }
  show("quiz-screen");
  drawQuestion();
}

function currentQ() {
  return state.queue[state.index];
}

function drawQuestion() {
  const q = currentQ();
  state.selected = null;
  state.locked = false;
  document.getElementById("q-tag").textContent = q.tag;
  document.getElementById("q-progress").textContent =
    `Question ${state.index + 1} of ${state.queue.length}`;
  const typeLabel = { mc: "Multiple choice", tf: "True / False", short: "Short answer", application: "Application" };
  document.getElementById("q-type").textContent = typeLabel[q.type] || q.type;
  document.getElementById("q-prompt").textContent = q.prompt;
  const choices = document.getElementById("q-choices");
  const shortWrap = document.getElementById("q-short");
  const feedback = document.getElementById("feedback");
  feedback.className = "feedback hidden";
  feedback.textContent = "";
  document.getElementById("submit-btn").classList.remove("hidden");
  document.getElementById("next-btn").classList.add("hidden");
  document.getElementById("short-input").value = "";

  if (q.type === "short") {
    choices.innerHTML = "";
    shortWrap.classList.remove("hidden");
  } else {
    shortWrap.classList.add("hidden");
    choices.innerHTML = "";
    q.choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = (q.type === "tf" ? "" : String.fromCharCode(65 + i) + ". ") + c;
      b.onclick = () => {
        if (state.locked) return;
        state.selected = i;
        [...choices.children].forEach(el => el.classList.remove("selected"));
        b.classList.add("selected");
      };
      choices.appendChild(b);
    });
  }
}

function checkAnswer() {
  const q = currentQ();
  if (state.locked) return;
  let ok = false;
  let userText = "";
  if (q.type === "short") {
    userText = document.getElementById("short-input").value;
    ok = matchesAccept(userText, q.accept);
  } else {
    if (state.selected === null) {
      alert("Pick an answer first.");
      return;
    }
    userText = q.choices[state.selected];
    ok = state.selected === q.answer;
    const nodes = [...document.getElementById("q-choices").children];
    nodes.forEach((el, i) => {
      if (i === q.answer) el.classList.add("right");
      if (i === state.selected && !ok) el.classList.add("wrong");
    });
  }
  state.locked = true;
  state.answeredThisRun += 1;
  if (ok) {
    state.correctThisRun += 1;
    const ids = loadCorrect();
    ids.push(q.id);
    saveCorrect(ids);
  }
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  const correctText = q.type === "short"
    ? (q.accept && q.accept[0] ? q.accept[0] : "")
    : q.choices[q.answer];
  fb.innerHTML = `<strong>${ok ? "Correct" : "Incorrect"}</strong> · tagged ${q.tag}<br>` +
    (ok ? "" : `Expected: ${correctText}<br>`) +
    q.explain;
  document.getElementById("submit-btn").classList.add("hidden");
  document.getElementById("next-btn").classList.remove("hidden");
}

function nextQuestion() {
  if (state.index + 1 >= state.queue.length) {
    endQuiz();
    return;
  }
  state.index += 1;
  drawQuestion();
}

function endQuiz() {
  show("end-screen");
  document.getElementById("end-summary").textContent =
    `You answered ${state.correctThisRun} of ${state.answeredThisRun} correctly this session. ` +
    `Mastered items stay excluded until you reset progress.`;
}

document.getElementById("start-btn").onclick = startQuiz;
document.getElementById("reset-btn").onclick = () => {
  localStorage.removeItem(STORAGE_KEY);
  renderPicker();
};
document.getElementById("submit-btn").onclick = checkAnswer;
document.getElementById("next-btn").onclick = nextQuestion;
document.getElementById("quit-btn").onclick = endQuiz;
document.getElementById("again-btn").onclick = () => { renderPicker(); show("start-screen"); };
document.getElementById("short-input").addEventListener("keydown", e => {
  if (e.key === "Enter") checkAnswer();
});

renderPicker();

  </script>
