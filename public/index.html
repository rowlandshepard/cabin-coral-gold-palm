<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HA Unit 1 · Core Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Human Anatomy · Unit 1</p>
        <h1>Core Study Quiz</h1>
      </div>
      <p class="tagline">One question at a time · answers tagged by lecture</p>
    </header>

    <section id="start-screen" class="card start">
      <h2>Lecture picker</h2>
      <p class="muted">Questions are pulled from the Unit 1 study guide and answered from the lecture decks. Correct items can be skipped on later runs.</p>
      <div class="picker" id="lecture-picker"></div>
      <label class="check">
        <input type="checkbox" id="skip-correct" checked />
        Subsequent quizzes exclude questions you already answered correctly
      </label>
      <div class="stats" id="start-stats"></div>
      <div class="row">
        <button id="start-btn" class="primary">Start quiz</button>
        <button id="reset-btn" class="ghost">Reset saved progress</button>
      </div>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="meta">
        <span id="q-tag" class="pill"></span>
        <span id="q-progress" class="muted"></span>
      </div>
      <p id="q-type" class="type"></p>
      <h2 id="q-prompt"></h2>
      <div id="q-choices"></div>
      <div id="q-short" class="hidden">
        <input id="short-input" type="text" autocomplete="off" placeholder="Type your answer" />
      </div>
      <div class="row">
        <button id="submit-btn" class="primary">Check answer</button>
        <button id="next-btn" class="ghost hidden">Next question</button>
        <button id="quit-btn" class="ghost">End quiz</button>
      </div>
      <div id="feedback" class="feedback hidden"></div>
    </section>

    <section id="end-screen" class="card hidden">
      <h2>Session complete</h2>
      <p id="end-summary"></p>
      <div class="row">
        <button id="again-btn" class="primary">Back to lecture picker</button>
      </div>
    </section>
  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
